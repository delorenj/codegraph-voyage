[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph-voyage"
version = "0.1.0"
description = "Hybrid semantic retrieval sidecar for CodeGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jarad", email = "delorenj@delo.sh" }
]
# mcp is a core dependency: the codegraph-voyage-mcp console script is always
# installed, so it must never be importable-broken by a missing optional extra.
# >=2.0.0 because mcp_server imports MCPServer from mcp.server.mcpserver, the
# 2.x API (in 1.x that module does not exist).
dependencies = ["mcp>=2.0.0"]

[project.scripts]
codegraph-voyage = "codegraph_voyage.cli:main"
codegraph-voyage-mcp = "codegraph_voyage.mcp_server:main"
